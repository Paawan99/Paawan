# Canadian banks, credit unions, and fintechs.
#
# Most Canadian banks/CUs use Workday. Workday entries need:
#   tenant: short tenant slug (lowercase)
#   host:   the full myworkdayjobs.com host
#   site:   the external careers site name (case-sensitive!)
#   country: "Canada"  -> client-side filter to keep only Canadian postings
#   fetch_descriptions: true  -> pulls full JD for the top N (needed for
#                                 keyword matching to work well)
#
# HOW TO FIND tenant/host/site FOR A WORKDAY CAREERS PAGE:
#   1. Open the company's careers page in a browser.
#   2. Open DevTools (F12) -> Network tab, filter for "jobs".
#   3. Scroll the jobs list so a request fires.
#   4. Look for a POST to: /wday/cxs/<TENANT>/<SITE>/jobs
#      - the host (e.g. td.wd3.myworkdayjobs.com) goes in `host`
#      - TENANT goes in `tenant` (usually same as the first word of the host)
#      - SITE goes in `site` (case-sensitive, often "External" or
#        "<Company>_Careers")
#
# Entries marked "# VERIFY" are my best guesses -- if a scan logs 404 or
# 422 for one, open that bank's real careers page in a browser and
# copy the values from DevTools as above.

companies:
  # ===================================================================
  # Big Six Canadian banks
  # ===================================================================
  - { name: "RBC",                board: workday, tenant: rbc,
      host: rbc.wd3.myworkdayjobs.com, site: RBC_Careers,
      country: Canada, fetch_descriptions: true, descriptions_limit: 50 } # VERIFY

  - { name: "TD Bank",            board: workday, tenant: td,
      host: td.wd3.myworkdayjobs.com, site: TD_External_Career_Site,
      country: Canada, fetch_descriptions: true, descriptions_limit: 50 } # VERIFY

