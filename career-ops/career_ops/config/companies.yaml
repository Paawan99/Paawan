# Canadian banks, credit unions, and fintechs.
#
# Most Canadian banks/CUs use Workday. Workday entries need:
#   tenant: short tenant slug (lowercase)
#   host:   the full myworkdayjobs.com host
#   site:   the external careers site name (case-sensitive!)
#   country: optional locale facet, e.g. "Canada"
#   fetch_descriptions: true  -> pulls full JD for the top N (slower but
#                                 needed for keyword matching to work well)
#
# How to find tenant/host/site for any Workday careers page:
#   1. Open the company's careers page in a browser.
#   2. Open DevTools -> Network tab, filter for "jobs".
#   3. Look for a POST to /wday/cxs/<TENANT>/<SITE>/jobs and copy
#      the host (e.g. td.wd3.myworkdayjobs.com), tenant, and site.
#
# I've filled in best-known values below. VERIFY each one against the
# company's live careers page -- Workday tenants occasionally change
# region (wd1/wd3/wd5) or rename their site.

companies:
  # ===================================================================
  # Big Six Canadian banks (all on Workday)
  # ===================================================================
  - { name: "RBC",                board: workday, tenant: rbc,
      host: rbc.wd3.myworkdayjobs.com, site: RBC_Careers,
      country: Canada, fetch_descriptions: true, descriptions_limit: 50 }

  - { name: "TD Bank",            board: workday, tenant: td,
      host: td.wd3.myworkdayjobs.com, site: TD_External_Career_Site,
      country: Canada, fetch_descriptions: true, descriptions_limit: 50 }

  - { name: "Scotiabank",         board: workday, tenant: scotiabank,
      host: scotiabank.wd3.myworkdayjobs.com, site: Scotiabank_Careers,
      country: Canada, fetch_descriptions: true, descriptions_limit: 50 }

  - { name: "BMO",                board: workday, tenant: bmo,
